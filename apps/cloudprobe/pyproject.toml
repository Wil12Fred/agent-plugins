[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudprobe"
version = "0.1.0"
description = "Read-only forensics for a GKE + Cloudflare deployment: probe failures, logs, metrics, edge requests, and whether the thing you just shipped made anything worse."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["opscore", "typer>=0.15", "rich>=13.9", "httpx>=0.27", "pyyaml>=6.0"]

[project.scripts]
cloudprobe = "cloudprobe.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]

[tool.uv.sources]
opscore = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cloudprobe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
