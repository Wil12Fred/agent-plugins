[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slack-bridge"
version = "0.1.0"
description = "Drive Claude Code and Codex sessions from a private Slack channel: reply in a thread, the agent answers there."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "slack-bolt>=1.21",
    "slack-sdk>=3.33",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
slackbridge = "slackbridge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/slackbridge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["slack_bolt.*", "slack_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
