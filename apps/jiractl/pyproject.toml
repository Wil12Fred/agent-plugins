[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jiractl"
version = "0.1.0"
description = "JIRA Cloud from the terminal: read tickets, post comments written as markdown and rendered as ADF, attach evidence and embed it inline, mention people by name."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["opscore", "typer>=0.15", "rich>=13.9", "httpx>=0.27"]

[project.scripts]
jiractl = "jiractl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]

[tool.uv.sources]
opscore = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/jiractl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: reaches a real JIRA; run with -m integration"]
