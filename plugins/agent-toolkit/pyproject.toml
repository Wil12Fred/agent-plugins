[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentctl"
version = "0.1.0"
description = "Measure what an agent would otherwise have to judge: what practices a repository has adopted, and what code leaked out of its code directory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.15",
    "mcp>=2.0",
]

[project.optional-dependencies]
# klembord -> stopit still imports pkg_resources, gone in setuptools 81.
clipboard = ["klembord>=0.3", "setuptools<81"]

[project.scripts]
agentctl = "agentctl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentctl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = ["integration: runs a real browser; skips when none is installed"]

[tool.mypy]
strict = true
python_version = "3.11"

# klembord ships no py.typed. It is an optional extra reached through one call
# on the X11 fallback path, so the alternative is a stub file for a dependency
# most installs never pull in.
[[tool.mypy.overrides]]
module = ["klembord.*"]
ignore_missing_imports = true
